# Nginx reverse proxy for the Account Provisioning System (localhost:3000)
#
# Deployment steps:
#   1. Replace provisioning.example.com with the real domain.
#   2. Point ssl_certificate / ssl_certificate_key at your issued certs.
#   3. Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/account-provisioning
#   4. Enable:   sudo ln -s /etc/nginx/sites-available/account-provisioning /etc/nginx/sites-enabled/
#   5. Test:     sudo nginx -t && sudo systemctl reload nginx
#
# Secrets are NOT defined here; the app loads them from .env via dotenv (gitignored).

# Global rate-limit zones
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name provisioning.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name provisioning.example.com;

    ssl_certificate     /etc/ssl/certs/provisioning.example.com.pem;
    ssl_certificate_key /etc/ssl/private/provisioning.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Payment webhook ingress (HMAC-authenticated) with burst-tolerant limiting
    location /webhook {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin panel (session-authenticated)
    location / {
        limit_req zone=admin_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
